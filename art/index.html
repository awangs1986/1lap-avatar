<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>骑自行车的鹈鹕 · SVG 预览</title>
    <style>
      :root {
        --ink: #241a27;
        --paper: #f6f3ee;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 40px 20px 72px;
        background: var(--paper);
        color: var(--ink);
        font: 15px/1.7 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
      }
      h1 { font-size: 22px; margin: 0; letter-spacing: .04em; }
      p.sub { margin: -18px 0 0; opacity: .62; font-size: 13px; }
      .stage {
        width: min(560px, 92vw);
        border-radius: 28px;
        overflow: hidden;
        box-shadow: 0 18px 44px rgba(36, 26, 39, .18);
      }
      .stage img { display: block; width: 100%; height: auto; }
      .sizes {
        display: flex;
        align-items: flex-end;
        gap: 22px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .chip {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 16px;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 6px 18px rgba(36, 26, 39, .1);
      }
      .chip.dark { background: #2b2733; }
      .chip img { display: block; }
      .chip span { font-size: 12px; opacity: .55; }
      .chip.dark span { color: #cfc8d8; }
      footer { font-size: 12.5px; opacity: .55; text-align: center; max-width: 560px; }
      code { background: rgba(36,26,39,.08); padding: 1px 6px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <h1>🚲 骑自行车的鹈鹕</h1>
    <p class="sub">单层自包含 SVG · 512×512 · SMIL 蹬踏 / 车轮 / 链条动画</p>

    <figure class="stage" style="margin:0">
      <img src="pelican-cyclist.svg" alt="骑自行车的鹈鹕" width="560" height="560" />
    </figure>

    <div class="sizes">
      <div class="chip"><img src="pelican-cyclist.svg" width="256" height="256" alt="" /><span>256（头像素材画布）</span></div>
      <div class="chip"><img src="pelican-cyclist.svg" width="128" height="128" alt="" /><span>128</span></div>
      <div class="chip dark"><img src="pelican-cyclist.svg" width="96" height="96" alt="" /><span>96 · 深色底</span></div>
      <div class="chip dark"><img src="pelican-cyclist.svg" width="64" height="64" alt="" /><span>64 · 深色底</span></div>
    </div>

    <footer>
      源文件 <code>art/pelican-cyclist.svg</code>；重新生成：<code>node art/generate-pelican-cyclist.mjs</code><br />
      美术风格与 <code>packages/assets</code> 头像素材一致（扁平色块 + #241a27 墨线）。动画为 SMIL，静态渲染器自动退化为初始帧。
    </footer>
  </body>
</html>
