            <path d="M-7 -1C1 -9 19 -10 29 -5L33 3C24 7 17 2 11 7C5 2 -2 7 -10 4Z" fill="#e8892b"/>
            <path d="M6 -2L10 4M18 -3L21 4" stroke="#241a27" stroke-width="2.4" stroke-linecap="round" opacity=".5"/>
          </g>
        </g>
      </g>
    </g>
    <circle cx="256" cy="378" r="8" fill="#a9b8c4" stroke="#241a27" stroke-width="3"/>
