      <animate attributeName="stroke-dashoffset" values="0;-20" dur="0.2s" repeatCount="indefinite"/>
    </path>

    <!-- 牙盘 -->
    <g transform="rotate(0 256 378)">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 256 378" to="360 256 378" dur="1.2s" repeatCount="indefinite"/>
      <circle cx="256" cy="378" r="20" fill="#a9b8c4" stroke="#241a27" stroke-width="3"/>
      <circle cx="256" cy="378" r="22" fill="none" stroke="#241a27" stroke-width="4" stroke-dasharray="4 7"/>
      <circle cx="256" cy="378" r="11" fill="none" stroke="#241a27" stroke-width="2.5" opacity=".45"/>
    </g>

    <!-- 座管 + 座垫 -->
    <path d="M222 214L212 192" stroke="#241a27" stroke-width="14" stroke-linecap="round"/>
    <path d="M222 214L212 192" stroke="#a9b8c4" stroke-width="8" stroke-linecap="round"/>
    <path d="M154 190C164 176 226 174 248 186C242 200 172 206 154 190Z" fill="#3f3e50" stroke="#241a27" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M164 187C178 181 216 180 238 185" stroke="#6d6c80" stroke-width="3" stroke-linecap="round" opacity=".8"/>

    <!-- 把立 + 车把 -->
    <path d="M351 223L372 205" stroke="#241a27" stroke-width="15" stroke-linecap="round"/>
    <path d="M351 223L372 205" stroke="#a9b8c4" stroke-width="9" stroke-linecap="round"/>
    <path d="M372 205Q398 192 418 202" stroke="#241a27" stroke-width="14" stroke-linecap="round"/>
    <path d="M372 205Q398 192 418 202" stroke="#a9b8c4" stroke-width="8" stroke-linecap="round"/>
    <path d="M404 197L421 203" stroke="#241a27" stroke-width="15" stroke-linecap="round"/>
    <path d="M404 197L421 203" stroke="#3f3e50" stroke-width="10" stroke-linecap="round"/>

