<?xml version="1.0" encoding="UTF-8"?>
<!-- 骑自行车的鹈鹕 · 扁平描边风 · 512×512 · 含 SMIL 蹬踏动画 -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 512 512" width="512" height="512" fill="none" role="img"
  aria-labelledby="pelicanTitle pelicanDesc">
  <title id="pelicanTitle">骑自行车的鹈鹕</title>
  <desc id="pelicanDesc">一只白羽橙喙的鹈鹕系着红围巾，蹬着一辆青绿色自行车向前行驶，喉囊里还兜着一条鱼。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9eefb"/>
      <stop offset="1" stop-color="#f8fdff"/>
    </linearGradient>
    <clipPath id="card">
      <rect width="512" height="512" rx="48"/>
    </clipPath>
  <g id="wheel">
    <circle r="71" fill="none" stroke="#33323f" stroke-width="14"/>
    <circle r="71" fill="none" stroke="#4c4b60" stroke-width="13" stroke-dasharray="5 26" opacity=".9"/>
    <circle r="60" fill="none" stroke="#241a27" stroke-width="8"/>
    <circle r="60" fill="none" stroke="#f2f6f9" stroke-width="5"/>
    <g stroke="#c6d1da" stroke-width="3" stroke-linecap="round">
    <line x1="11" y1="0" x2="57" y2="0"/>
    <line x1="9.5" y1="5.5" x2="49.4" y2="28.5"/>
    <line x1="5.5" y1="9.5" x2="28.5" y2="49.4"/>
    <line x1="0" y1="11" x2="0" y2="57"/>
    <line x1="-5.5" y1="9.5" x2="-28.5" y2="49.4"/>
    <line x1="-9.5" y1="5.5" x2="-49.4" y2="28.5"/>
    <line x1="-11" y1="0" x2="-57" y2="0"/>
    <line x1="-9.5" y1="-5.5" x2="-49.4" y2="-28.5"/>
    <line x1="-5.5" y1="-9.5" x2="-28.5" y2="-49.4"/>
    <line x1="0" y1="-11" x2="0" y2="-57"/>
    <line x1="5.5" y1="-9.5" x2="28.5" y2="-49.4"/>
    <line x1="9.5" y1="-5.5" x2="49.4" y2="-28.5"/>
    </g>
    <circle r="10" fill="#a9b8c4" stroke="#241a27" stroke-width="3"/>
  </g>

    <!-- 腿部：一条 path 定义 + 动画，用 <use> 分别描墨线与上色 -->
    <path id="legNear" d="M234 205L322.8 259.2L289 366" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" calcMode="linear"
      keyTimes="0;0.1;0.1;0.2;0.3;0.3;0.4;0.4;0.5;0.6;0.6;0.7;0.8;0.8;0.9;0.9;1"
      values="M234 205L322.8 259.2L289 366;M234 205L315.2 270L286.6 378.2;M234 205L306.2 279.8L279.6 388.6;M234 205L297.7 287.2L269.2 395.6;M234 205L291.7 291.5L257 398;M234 205L289.6 292.9L244.8 395.6;M234 205L291 292L234.4 388.6;M234 205L295.2 289.1L227.4 378.2;M234 205L301.5 284.2L225 366;M234 205L309 277L227.4 353.8;M234 205L317 267.7L234.4 343.4;M234 205L323.9 257.2L244.8 336.4;M234 205L328.7 248L257 334;M234 205L330.8 242.9L269.2 336.4;M234 205L330.6 243.6L279.6 343.4;M234 205L327.9 249.7L286.6 353.8;M234 205L322.8 259.2L289 366"/>
    </path>
    <path id="legFar" d="M224 201L290.9 278L225 366" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" calcMode="linear"
      keyTimes="0;0.1;0.1;0.2;0.3;0.3;0.4;0.4;0.5;0.6;0.6;0.7;0.8;0.8;0.9;0.9;1"
      values="M224 201L290.9 278L225 366;M224 201L299 270.2L227.4 353.8;M224 201L306.8 260.6L234.4 343.4;M224 201L313.3 250.4L244.8 336.4;M224 201L317.4 242L257 334;M224 201L318.9 238.3L269.2 336.4;M224 201L318.1 240.3L279.6 343.4;M224 201L314.8 247.4L286.6 353.8;M224 201L308.7 257.8L289 366;M224 201L300 269.1L286.6 378.2;M224 201L289.6 279.1L279.6 388.6;M224 201L280.2 286.1L269.2 395.6;M224 201L274.8 289.4L257 398;M224 201L274.5 289.6L244.8 395.6;M224 201L277.9 287.6L234.4 388.6;M224 201L283.7 283.7L227.4 378.2;M224 201L290.9 278L225 366"/>
    </path>
  </defs>

