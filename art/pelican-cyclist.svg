    <path d="M190 142C156 136 124 144 110 162C136 172 172 168 196 158Z" fill="#ece0cd" stroke="#241a27" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M180 148C160 148 142 152 130 158M184 156C166 157 150 161 140 165" stroke="#241a27" stroke-width="2.5" stroke-linecap="round" opacity=".45"/>

