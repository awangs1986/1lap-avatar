      <path d="M252 102C220 94 186 98 158 112C186 110 218 110 248 116Z" fill="#cf4b46" stroke="#241a27" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M250 112C222 114 194 124 174 140C198 132 226 126 250 126Z" fill="#e8615a" stroke="#241a27" stroke-width="3.5" stroke-linejoin="round"/>
    </g>
    <path d="M252 92Q266 114 258 144" stroke="#241a27" stroke-width="25" stroke-linecap="round"/>
    <path d="M252 92Q266 114 258 144" stroke="#e8615a" stroke-width="18" stroke-linecap="round"/>
    <path d="M255 98Q265 114 261 136" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".28"/>

    <!-- 冠羽 -->
    <path d="M344 62C332 50 316 44 304 48C316 55 328 64 336 76Z" fill="#ece0cd" stroke="#241a27" stroke-width="3" stroke-linejoin="round"/>
    <path d="M340 76C328 68 312 64 300 68C312 73 324 82 332 92Z" fill="#fdf7ee" stroke="#241a27" stroke-width="3" stroke-linejoin="round"/>

    <!-- 头 -->
    <ellipse cx="366" cy="82" rx="32" ry="28" transform="rotate(-8 366 82)" fill="#fdf7ee" stroke="#241a27" stroke-width="4"/>
    <path d="M352 100C366 108 384 106 394 96" stroke="#ece0cd" stroke-width="4" stroke-linecap="round" opacity=".8"/>

