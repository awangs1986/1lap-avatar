      fill="#f2a13c" stroke="#241a27" stroke-width="4" stroke-linejoin="round"/>
    <path d="M392 70C428 70 462 80 492 92" stroke="#ffd08a" stroke-width="3.5" stroke-linecap="round" opacity=".7"/>
    <path d="M400 78q7 -2 12 0" stroke="#241a27" stroke-width="2.6" stroke-linecap="round" opacity=".65"/>

    <!-- 眼睛 -->
    <path d="M360 58q12 -6 22 -1" stroke="#241a27" stroke-width="3.4" stroke-linecap="round" opacity=".55"/>
    <circle cx="373" cy="72" r="9.5" fill="#fffaf8" stroke="#241a27" stroke-width="3"/>
    <circle cx="375" cy="73" r="5" fill="#3b2a20"/>
    <circle cx="377" cy="70.5" r="1.8" fill="#ffffff"/>

    <!-- 近侧翅膀（伸向车把） -->
    <path d="M246 130C296 134 340 154 374 170C386 178 398 188 410 194C400 204 382 202 366 194C330 178 288 162 248 156Z"
      fill="#fdf7ee" stroke="#241a27" stroke-width="4" stroke-linejoin="round"/>
    <path d="M264 148C300 154 336 170 366 190" stroke="#ece0cd" stroke-width="4" stroke-linecap="round"/>
    <path d="M374 176q16 7 30 13M368 185q15 6 29 10M360 192q13 4 25 7" stroke="#241a27" stroke-width="2.6" stroke-linecap="round" opacity=".45"/>

    <!-- ===================== 近侧曲柄 / 腿 / 踏板 ===================== -->
    <g transform="rotate(0 256 378)">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 256 378" to="360 256 378" dur="1.2s" repeatCount="indefinite"/>
      <line x1="256" y1="378" x2="288" y2="378" stroke="#241a27" stroke-width="16" stroke-linecap="round"/>
      <line x1="256" y1="378" x2="288" y2="378" stroke="#a9b8c4" stroke-width="10" stroke-linecap="round"/>
    </g>
    <use href="#legNear" xlink:href="#legNear" stroke="#241a27" stroke-width="26"/>
    <use href="#legNear" xlink:href="#legNear" stroke="#e8892b" stroke-width="19"/>
    <g transform="rotate(0 256 378)">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 256 378" to="360 256 378" dur="1.2s" repeatCount="indefinite"/>
      <g transform="translate(288,378)">
        <g transform="rotate(0)"><animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0" to="-360" dur="1.2s" repeatCount="indefinite"/>
