    <!-- 地面投影 -->
    <ellipse cx="150" cy="452" rx="66" ry="9" fill="#241a27" opacity=".16"/>
    <ellipse cx="392" cy="452" rx="66" ry="9" fill="#241a27" opacity=".16"/>
    <ellipse cx="272" cy="452" rx="120" ry="10" fill="#241a27" opacity=".1"/>

    <!-- 路面 -->
    <rect x="-10" y="450" width="532" height="72" fill="#c8cfd7"/>
    <rect x="-10" y="450" width="532" height="5" fill="#a8b1bb"/>
    <path d="M-10 490H522" stroke="#f1f5f8" stroke-width="9" stroke-dasharray="46 42">
      <animate attributeName="stroke-dashoffset" values="0;88" dur="0.45s" repeatCount="indefinite"/>
    </path>

    <!-- ===================== 远侧腿（车后） ===================== -->
    <use href="#legFar" xlink:href="#legFar" stroke="#241a27" stroke-width="25"/>
    <use href="#legFar" xlink:href="#legFar" stroke="#c9762a" stroke-width="18"/>
    <!-- 远侧曲柄 + 踏板 + 蹼足 -->
    <g transform="rotate(180 256 378)">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="180 256 378" to="540 256 378" dur="1.2s" repeatCount="indefinite"/>
      <line x1="256" y1="378" x2="288" y2="378" stroke="#241a27" stroke-width="15" stroke-linecap="round"/>
      <line x1="256" y1="378" x2="288" y2="378" stroke="#8b98a5" stroke-width="9" stroke-linecap="round"/>
      <g transform="translate(288,378)">
        <g transform="rotate(-180)"><animateTransform attributeName="transform" attributeType="XML" type="rotate" from="-180" to="-540" dur="1.2s" repeatCount="indefinite"/>
          <rect x="-17" y="-5" width="34" height="10" rx="4" fill="#4b4a5c" stroke="#241a27" stroke-width="3"/>
          <g transform="translate(1,-14)" stroke="#241a27" stroke-width="3" stroke-linejoin="round">
            <path d="M-6 -1C2 -8 18 -9 27 -4L30 3C22 6 16 2 10 6C4 2 -2 6 -9 4Z" fill="#c9762a"/>
          </g>
        </g>
      </g>
    </g>

    <!-- ===================== 车轮 ===================== -->
  <!-- 后轮 -->
  <g transform="translate(150,372)">
    <g><animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0" to="360" dur="0.6s" repeatCount="indefinite"/>
      <use href="#wheel" xlink:href="#wheel"/>
    </g>
  </g>
  <!-- 前轮 -->
  <g transform="translate(392,372)">
    <g><animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0" to="360" dur="0.6s" repeatCount="indefinite"/>
      <use href="#wheel" xlink:href="#wheel"/>
    </g>
  </g>
    <!-- 飞轮 -->
    <g transform="translate(150,372)">
      <g><animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0" to="360" dur="0.6s" repeatCount="indefinite"/>
        <circle r="15" fill="#a9b8c4" stroke="#241a27" stroke-width="3"/>
        <circle r="11" fill="none" stroke="#241a27" stroke-width="2" stroke-dasharray="3 5" opacity=".55"/>
      </g>
    </g>

    <!-- ===================== 车架 ===================== -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#241a27" stroke-width="16">
      <path d="M256 374L222 214"/>
      <path d="M226 216L350 226"/>
      <path d="M256 374L358 258"/>
      <path d="M150 372L256 378"/>
      <path d="M150 372L224 228"/>
      <path d="M362 264L392 372"/>
      <path d="M350 222L363 266"/>
    </g>
    <g stroke="#2e8b84" stroke-width="9">
      <path d="M256 374L222 214"/>
      <path d="M226 216L350 226"/>
      <path d="M256 374L358 258"/>
      <path d="M150 372L256 378"/>
      <path d="M150 372L224 228"/>
      <path d="M362 264L392 372"/>
      <path d="M350 222L363 266"/>
    </g>
    <g stroke="#ffffff" stroke-width="3" opacity=".22">
      <path d="M256 374L222 214"/>
      <path d="M226 216L350 226"/>
      <path d="M256 374L358 258"/>
      <path d="M150 372L256 378"/>
      <path d="M150 372L224 228"/>
      <path d="M362 264L392 372"/>
      <path d="M350 222L363 266"/>
    </g>
    </g>

    <!-- 链条 -->
    <path d="M150 357L256 358A20 20 0 0 1 256 398L150 387A15 15 0 0 0 150 357Z"
